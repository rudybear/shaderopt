[scenario]
name = "vignette_noise"
split = "holdout"
width = 1920
height = 1080

[[inputs]]
name = "scene"
format = "RGBA8"
generator = "noise"
seed = 42
params = {scale=1.0}

[[passes]]
name = "vignette"
shader = "vignette_grain"
samplers = { u_src = "scene" }
uniforms = { center = [0.5, 0.5], radius = 0.45, softness = 0.5, grain_amount = 0.04, time = 1.0, aspect = 1.7777777777777777 }
output = { format = "RGBA8", scale = 1.0 }
