[scenario]
name = "colorgrade_photo"
split = "train"
width = 1920
height = 1080

[[inputs]]
name = "scene"
format = "RGBA8"
generator = "checker"
seed = 22
params = {cells=64}

[[passes]]
name = "grade"
shader = "color_grade"
samplers = { u_src = "scene" }
uniforms = { lift = [0.02, 0.01, 0.0, 0.0], gamma = [1.0, 1.05, 1.1, 1.0], gain = [1.1, 1.0, 0.95, 1.0], mat_r = [0.9, 0.08, 0.02, 0.0], mat_g = [0.05, 0.9, 0.05, 0.0], mat_b = [0.02, 0.08, 0.9, 0.0], saturation = 1.2, temperature = 0.3 }
output = { format = "RGBA8", scale = 1.0 }
