[scenario]
name = "deferred_spheres"
split = "train"
width = 1920
height = 1080

# G-buffer formats as a deferred renderer would keep them. deferred_lit reads u_shadow.r (R16F samples as
# (r, 0, 0, 1)) and u_shadowuv.xyz; shadowuv.z is a depth in [0, 1], so RGBA16F's ~1e-3 spacing near 0.5
# is accepted here (the checker occluder depth 0.3 vs receiver 0.5..0.8 is far from that resolution).
[[inputs]]
name = "albedo"
format = "RGBA8"
generator = "gbuffer"
seed = 51
params = { which = "albedo" }

[[inputs]]
name = "normal"
format = "RGBA16F"
generator = "gbuffer"
seed = 51
params = { which = "normal" }

[[inputs]]
name = "shadowuv"
format = "RGBA16F"
generator = "gbuffer"
seed = 51
params = { which = "shadowuv" }

[[inputs]]
name = "shadow"
format = "R16F"
generator = "gbuffer"
seed = 51
params = { which = "shadow" }

[[passes]]
name = "lit"
shader = "deferred_lit"
samplers = { u_albedo = "albedo", u_normal = "normal", u_shadowuv = "shadowuv", u_shadow = "shadow" }
uniforms = { light1 = [-1.0, 1.0, 1.0, 0.8], light2 = [-1.0, 1.0, -1.0, 0.6], ambient = [0.15, 0.15, 0.18, 0.0], shadow_texel = [0.00052083, 0.00092593], depth_bias = -0.00005, shadow_min = 0.3 }
output = { format = "RGBA8", scale = 1.0 }
